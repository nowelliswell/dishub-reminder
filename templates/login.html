<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login WhatsApp - Reminder</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" />
  <link rel="stylesheet" href="/static/css/design-system.css">
  <link rel="stylesheet" href="/static/css/components.css">
  <link rel="stylesheet" href="/static/css/utilities.css">
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: var(--primary);
      padding: 1.5rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      text-align: center;
      box-shadow: var(--shadow-xl);
      max-width: 420px;
      width: 100%;
      animation: fadeIn 0.6s ease;
    }

    h2 {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.75rem;
      margin-bottom: 0.75rem;
    }

    #status {
      margin-bottom: 1.5rem;
      font-size: 1rem;
      color: var(--gray-600);
      min-height: 1.5rem;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    #qrcode canvas {
      border: 4px solid var(--gray-100);
      border-radius: var(--radius-lg);
      background: var(--white);
      box-shadow: var(--shadow-sm);
      max-width: 100%;
      height: auto;
    }

    .spinner {
      width: 3rem;
      height: 3rem;
      border: 3px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 1.5rem auto;
    }

    @keyframes spin { 
      to { transform: rotate(360deg); } 
    }

    .checkmark {
      display: none;
      font-size: 3.5rem;
      color: var(--success);
      margin-top: 1.5rem;
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.5s ease-in-out;
    }

    .checkmark.show {
      display: block;
      opacity: 1;
      transform: scale(1);
    }

    .status-message {
      padding: 0.875rem 1rem;
      border-radius: var(--radius-md);
      margin-bottom: 1rem;
      font-weight: 500;
      display: none;
    }

    .status-message.error {
      background-color: var(--danger-light);
      color: var(--danger);
      border-left: 4px solid var(--danger);
    }

    #qrTimer {
      font-size: 0.875rem;
      color: var(--gray-500);
      margin-bottom: 1rem;
    }

    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(20px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.5rem; }
      h2 { font-size: 1.5rem; }
      #qrcode canvas { max-width: 90%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Login WhatsApp</h2>
    <p id="status">🔄 Mengecek status koneksi...</p>
    <p id="qrTimer" style="display: none;"></p>

    <div id="errorMessage" class="status-message error">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span id="errorText">Terjadi kesalahan</span>
    </div>

    <div id="warningMessage" class="status-message warning" style="background-color: #fff3cd; color: #664d03; border-left: 4px solid #ffc107; display: none; padding: 0.875rem 1rem; border-radius: var(--radius-md); margin-bottom: 1rem; font-weight: 500; text-align: left; font-size: 0.875rem;">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span id="warningText">Peringatan</span>
    </div>

    <div id="qrcode"></div>
    <div class="spinner" id="spinner"></div>
    <div class="checkmark" id="checkmark">✔</div>

    <button id="refreshBtn" class="btn btn-primary" style="display: none;">
      <i class="bi bi-arrow-clockwise"></i> Refresh QR Code
    </button>
    <button id="btnCancel" class="btn btn-outline-secondary w-100" style="display: none; margin-top: 0.75rem;">
      <i class="bi bi-arrow-left"></i> Kembali ke Dashboard
    </button>
  </div>

  <script>
    const statusEl = document.getElementById("status");
    const qrcodeEl = document.getElementById("qrcode");
    const spinnerEl = document.getElementById("spinner");
    const checkmarkEl = document.getElementById("checkmark");
    const refreshBtn = document.getElementById("refreshBtn");
    const errorMessage = document.getElementById("errorMessage");
    const qrTimerEl = document.getElementById("qrTimer");
    const warningMessage = document.getElementById("warningMessage");
    const btnCancel = document.getElementById("btnCancel");

    let qrCountdownInterval;
    let pollingInterval;
    const QR_EXPIRATION_TIME = 60;

    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const WABOT_BASE = isLocal ? "http://localhost:3000" : "";
    let isFirstCheck = true;

    function showError(message) {
      errorMessage.style.display = "block";
      document.getElementById("errorText").textContent = message;
      refreshBtn.style.display = "inline-flex";
      spinnerEl.style.display = "none";
      qrTimerEl.style.display = "none";
      btnCancel.style.display = "none";
      clearInterval(qrCountdownInterval);
      clearInterval(pollingInterval);
      // Remove action container if it exists
      const actionContainer = document.getElementById("actionContainer");
      if (actionContainer) actionContainer.remove();
    }

    function hideError() { 
      errorMessage.style.display = "none"; 
    }

    function showWarning(message) {
      const warningEl = document.getElementById("warningMessage");
      const warningTextEl = document.getElementById("warningText");
      if (warningEl && warningTextEl) {
        warningEl.style.display = "block";
        warningTextEl.textContent = message;
      }
    }

    function hideWarning() {
      const warningEl = document.getElementById("warningMessage");
      if (warningEl) warningEl.style.display = "none";
    }

    function startQrCountdown() {
      let timeLeft = QR_EXPIRATION_TIME;
      qrTimerEl.style.display = "block";
      qrTimerEl.textContent = `QR akan kadaluarsa dalam ${timeLeft} detik`;

      clearInterval(qrCountdownInterval);
      qrCountdownInterval = setInterval(() => {
        timeLeft--;
        if (timeLeft > 0) {
          qrTimerEl.textContent = `QR akan kadaluarsa dalam ${timeLeft} detik`;
        } else {
          qrTimerEl.textContent = "QR telah kadaluarsa. Silakan refresh.";
          qrcodeEl.innerHTML = "<small style='color:var(--gray-500)'>QR kadaluarsa</small>";
          refreshBtn.style.display = "inline-flex";
          clearInterval(qrCountdownInterval);
        }
      }, 1000);
    }

    function showConnectedState(activeUser) {
      clearInterval(qrCountdownInterval);
      clearInterval(pollingInterval);
      qrTimerEl.style.display = "none";
      qrcodeEl.innerHTML = "";
      spinnerEl.style.display = "none";
      checkmarkEl.classList.add("show");
      refreshBtn.style.display = "none";
      btnCancel.style.display = "none";
      
      const phone = activeUser ? activeUser.phone : "Perangkat Server";
      const name = activeUser ? activeUser.name : "WhatsApp";
      
      statusEl.innerHTML = `<span style="color: var(--success); font-weight: bold;"><i class="bi bi-check-circle-fill"></i> Terkoneksi ke WhatsApp</span><br><span style="font-size: 0.9rem; color: var(--gray-600); display: block; margin-top: 0.5rem;">Nomor: <strong>${phone} (${name})</strong></span>`;
      
      // Buat tombol aksi jika belum ada
      let actionContainer = document.getElementById("actionContainer");
      if (!actionContainer) {
        actionContainer = document.createElement("div");
        actionContainer.id = "actionContainer";
        actionContainer.className = "d-flex flex-column gap-2 mt-4";
        actionContainer.style.display = "flex";
        actionContainer.style.flexDirection = "column";
        actionContainer.style.gap = "0.75rem";
        actionContainer.style.marginTop = "1.5rem";
        document.querySelector(".card").appendChild(actionContainer);
      }
      
      actionContainer.innerHTML = `
        <button id="btnGoDashboard" class="btn btn-primary" style="width: 100%;">
          <i class="bi bi-speedometer2"></i> Masuk ke Dashboard
        </button>
        <button id="btnDisconnect" class="btn btn-outline-danger" style="width: 100%;">
          <i class="bi bi-box-arrow-left"></i> Putuskan & Ganti Akun
        </button>
      `;
      
      document.getElementById("btnGoDashboard").addEventListener("click", () => {
        sessionStorage.setItem('justLoggedIn', 'true');
        window.location.href = isLocal ? "http://localhost:3000/index.html" : "/index.html";
      });
      
      document.getElementById("btnDisconnect").addEventListener("click", async () => {
        const btn = document.getElementById("btnDisconnect");
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Memutuskan...';
        try {
          const res = await fetch(`${WABOT_BASE}/reset-auth`, { method: "DELETE" });
          if (!res.ok) throw new Error("Gagal reset auth");
          actionContainer.remove();
          checkmarkEl.classList.remove("show");
          spinnerEl.style.display = "block";
          statusEl.textContent = "🔄 Menyiapkan QR baru...";
          isFirstCheck = false;
          
          // Re-init connection and streams
          fetchQR();
          startQRStream();
        } catch (err) {
          showError("Gagal memutuskan koneksi");
          btn.disabled = false;
          btn.innerHTML = '<i class="bi bi-box-arrow-left"></i> Putuskan & Ganti Akun';
        }
      });
    }

    async function fetchQR() {
      try {
        const res = await fetch(`${WABOT_BASE}/qr`);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        if (data.lastErrorStatus === "SESSION_REPLACED") {
          showWarning("Sesi WhatsApp sebelumnya diambil alih oleh perangkat atau lokasi lain.");
        } else {
          hideWarning();
        }

        if (data.success && data.qr) {
          isFirstCheck = false;
          renderQR(data.qr);
        } else if (data.isConnected) {
          if (isFirstCheck) {
            showConnectedState(data.activeUser);
          } else {
            onConnected();
          }
        } else {
          statusEl.textContent = data.message || "Menunggu QR...";
        }
      } catch (err) {
        console.error("QR fetch error:", err);
        showError("Tidak dapat terhubung ke server. Pastikan server berjalan.");
      }
    }

    function renderQR(qr) {
      hideError();
      qrcodeEl.innerHTML = "";
      spinnerEl.style.display = "none";
      statusEl.innerHTML = "<i class='bi bi-qr-code-scan'></i> Scan QR berikut:";
      QRCode.toCanvas(qr, { width: 240 }, (err, canvas) => {
        if (!err && canvas) {
          qrcodeEl.appendChild(canvas);
          refreshBtn.style.display = "none";
          btnCancel.style.display = "inline-flex";
          startQrCountdown();
        } else {
          showError("Gagal membuat QR.");
        }
      });
    }

    function onConnected() {
      statusEl.innerHTML = "<i class='bi bi-check-circle-fill'></i> Terkoneksi ke WhatsApp!";
      spinnerEl.style.display = "none";
      checkmarkEl.classList.add("show");
      btnCancel.style.display = "none";
      clearInterval(qrCountdownInterval);
      clearInterval(pollingInterval);
      qrTimerEl.style.display = "none";
      const actionContainer = document.getElementById("actionContainer");
      if (actionContainer) actionContainer.remove();

      setTimeout(() => {
        sessionStorage.setItem('justLoggedIn', 'true');
        window.location.href = isLocal ? "http://localhost:3000/index.html" : "/index.html";
      }, 2000);
    }

    function startQRStream() {
      const source = new EventSource(`${WABOT_BASE}/qr-stream`);
      source.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.qr) {
          isFirstCheck = false;
          renderQR(data.qr);
        } else if (data.connected) {
          if (isFirstCheck) {
            fetch(`${WABOT_BASE}/qr`)
              .then(r => r.json())
              .then(resData => {
                showConnectedState(resData.activeUser);
              })
              .catch(() => {
                showConnectedState(null);
              });
            source.close();
          } else {
            onConnected();
            source.close();
          }
        }
      };
      source.onerror = () => {
        console.warn("SSE terputus, fallback ke polling...");
        source.close();
        pollingInterval = setInterval(fetchQR, 5000);
      };
    }

    refreshBtn.addEventListener("click", async () => {
      refreshBtn.disabled = true;
      refreshBtn.innerHTML = '<i class="bi bi-arrow-repeat"></i> Memuat...';
      qrcodeEl.innerHTML = "";
      statusEl.textContent = "🔄 Memuat QR baru...";
      spinnerEl.style.display = "block";

      try {
        const res = await fetch(`${WABOT_BASE}/reset-auth`, { method: "DELETE" });
        const data = await res.json();
        console.log(data.message);
        isFirstCheck = false;
        fetchQR();
      } catch {
        showError("Gagal memuat ulang QR");
      } finally {
        setTimeout(() => {
          refreshBtn.disabled = false;
          refreshBtn.innerHTML = '<i class="bi bi-arrow-clockwise"></i> Refresh QR Code';
        }, 2000);
      }
    });

    btnCancel.addEventListener("click", async () => {
      btnCancel.disabled = true;
      btnCancel.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Membatalkan...';
      try {
        await fetch(`${WABOT_BASE}/cancel-login`, { method: "POST" });
      } catch (err) {
        console.error("Gagal membatalkan koneksi:", err);
      }
      window.location.href = isLocal ? "http://localhost:3000/index.html" : "/index.html";
    });

    startQRStream();
  </script>
</body>
</html>
